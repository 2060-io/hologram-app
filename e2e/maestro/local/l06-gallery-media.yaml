appId: io.twentysixty.mobileagent.dev
tags: [local]
---
# Added first: the media picker lists a new file only once the media scanner has indexed it
- addMedia:
    - ../fixtures/image.jpg
    - ../fixtures/video.mp4
- runFlow: ../subflows/signup-both.yaml
- runFlow: ../subflows/connect-peers.yaml

- tapOn: "Bob"
- runFlow:
    file: ../subflows/wait-peer-features.yaml
    env:
      APP_ID: io.twentysixty.mobileagent.dev
      PEER_APP_ID: io.twentysixty.mobileagent.st
- runFlow:
    file: ../subflows/switch-app.yaml
    env:
      APP_ID: io.twentysixty.mobileagent.st
- runFlow:
    file: ../subflows/wait-peer-features.yaml
    env:
      APP_ID: io.twentysixty.mobileagent.st
      PEER_APP_ID: io.twentysixty.mobileagent.dev
- runFlow:
    file: ../subflows/switch-app.yaml
    env:
      APP_ID: io.twentysixty.mobileagent.dev

# A sent entry shows message-state-created until the upload is done and the message is submitted
- runFlow:
    file: ../subflows/send-gallery-media.yaml
    env:
      LABEL: "Photo taken on .*"
- extendedWaitUntil:
    visible: { id: "chat-image" }
    timeout: 60000
- extendedWaitUntil:
    visible: { id: "message-state-(submitted|received|viewed)" }
    timeout: 120000
- runFlow:
    file: ../subflows/send-gallery-media.yaml
    env:
      LABEL: "Video.* on .*"
- extendedWaitUntil:
    visible: { id: "chat-video" }
    timeout: 120000
- extendedWaitUntil:
    notVisible: { id: "message-state-created" }
    timeout: 180000
- extendedWaitUntil:
    visible: { id: "message-state-(submitted|received|viewed)" }
    timeout: 30000
- takeScreenshot: l06-a-sent

- runFlow:
    file: ../subflows/switch-app.yaml
    env:
      APP_ID: io.twentysixty.mobileagent.st
# chat-image-open only renders once B has downloaded and decrypted the file
- extendedWaitUntil:
    visible: { id: "chat-image-(open|download)" }
    timeout: 120000
- runFlow:
    when:
      visible: { id: "chat-image-download" }
    commands:
      - tapOn: { id: "chat-image-download" }
- extendedWaitUntil:
    visible: { id: "chat-image-open" }
    timeout: 120000
- tapOn: { id: "chat-image-open" }
- extendedWaitUntil:
    visible: { id: "chat-image-lightbox" }
    timeout: 15000
- takeScreenshot: l06-b-image-lightbox
- back
- extendedWaitUntil:
    notVisible: { id: "chat-image-lightbox" }
    timeout: 15000
- extendedWaitUntil:
    visible: { id: "chat-video-(download|play)" }
    timeout: 120000
- runFlow:
    when:
      visible: { id: "chat-video-download" }
    commands:
      - tapOn: { id: "chat-video-download" }
- extendedWaitUntil:
    visible: { id: "chat-video-play" }
    timeout: 120000
- tapOn: { id: "chat-video-play" }
- extendedWaitUntil:
    visible: { id: "chat-video-controls" }
    timeout: 30000
- assertNotVisible: "There was a problem loading the video."
- takeScreenshot: l06-b-video-player
- back
- extendedWaitUntil:
    notVisible: { id: "chat-video-player" }
    timeout: 15000

# A's own media is above the markers, so anything below a marker was sent by B
- tapOn: { id: "composer-input" }
- inputText: "marker one from Bob"
- tapOn: { id: "composer-send" }
- extendedWaitUntil:
    visible: { id: "message-state-(submitted|received|viewed)" }
    timeout: 30000
- runFlow:
    file: ../subflows/send-gallery-media.yaml
    env:
      LABEL: "Photo taken on .*"
- extendedWaitUntil:
    visible:
      id: "chat-image"
      below: "marker one from Bob"
    timeout: 60000
- extendedWaitUntil:
    notVisible: { id: "message-state-created" }
    timeout: 120000
- extendedWaitUntil:
    visible: { id: "message-state-(submitted|received|viewed)" }
    timeout: 30000

- runFlow:
    file: ../subflows/switch-app.yaml
    env:
      APP_ID: io.twentysixty.mobileagent.dev
- extendedWaitUntil:
    visible:
      id: "chat-image-(open|download)"
      below: "marker one from Bob"
    timeout: 120000
- runFlow:
    when:
      visible:
        id: "chat-image-download"
        below: "marker one from Bob"
    commands:
      - tapOn:
          id: "chat-image-download"
          below: "marker one from Bob"
- extendedWaitUntil:
    visible:
      id: "chat-image-open"
      below: "marker one from Bob"
    timeout: 120000
- tapOn:
    id: "chat-image-open"
    below: "marker one from Bob"
- extendedWaitUntil:
    visible: { id: "chat-image-lightbox" }
    timeout: 15000
- takeScreenshot: l06-a-image-lightbox
- back
- extendedWaitUntil:
    notVisible: { id: "chat-image-lightbox" }
    timeout: 15000

- runFlow:
    file: ../subflows/switch-app.yaml
    env:
      APP_ID: io.twentysixty.mobileagent.st
- tapOn: { id: "composer-input" }
- inputText: "marker two from Bob"
- tapOn: { id: "composer-send" }
- extendedWaitUntil:
    visible: { id: "message-state-(submitted|received|viewed)" }
    timeout: 30000
- runFlow:
    file: ../subflows/send-gallery-media.yaml
    env:
      LABEL: "Video.* on .*"
- extendedWaitUntil:
    visible:
      id: "chat-video"
      below: "marker two from Bob"
    timeout: 120000
- extendedWaitUntil:
    notVisible: { id: "message-state-created" }
    timeout: 180000
- extendedWaitUntil:
    visible: { id: "message-state-(submitted|received|viewed)" }
    timeout: 30000

- runFlow:
    file: ../subflows/switch-app.yaml
    env:
      APP_ID: io.twentysixty.mobileagent.dev
- extendedWaitUntil:
    visible:
      id: "chat-video-(download|play)"
      below: "marker two from Bob"
    timeout: 120000
- runFlow:
    when:
      visible:
        id: "chat-video-download"
        below: "marker two from Bob"
    commands:
      - tapOn:
          id: "chat-video-download"
          below: "marker two from Bob"
- extendedWaitUntil:
    visible:
      id: "chat-video-play"
      below: "marker two from Bob"
    timeout: 120000
- tapOn:
    id: "chat-video-play"
    below: "marker two from Bob"
- extendedWaitUntil:
    visible: { id: "chat-video-controls" }
    timeout: 30000
- assertNotVisible: "There was a problem loading the video."
- takeScreenshot: l06-a-video-player
- back
- extendedWaitUntil:
    notVisible: { id: "chat-video-player" }
    timeout: 15000
- takeScreenshot: l06-final
