# Finalize selectors with: maestro studio
appId: REPLACE_WITH_ANDROID_APPLICATION_ID
---
# Credential offer arrives over the live connection; wait for the offer UI
- extendedWaitUntil:
    visible:
      text: ".*(Credential|offer|Accept).*"
    timeout: 30000
- tapOn:
    text: ".*(Accept|Add).*"
# Credential stored
- assertVisible:
    text: ".*(received|added|credential).*"
