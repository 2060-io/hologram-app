appId: io.twentysixty.mobileagent.dev
---
# Attach appears only after the feature disclosure of the peer arrives, which needs turns of the two apps
- repeat:
    times: 6
    while:
      notVisible: { id: "composer-attach" }
    commands:
      - runFlow:
          file: switch-app.yaml
          env:
            APP_ID: ${PEER_APP_ID}
      - extendedWaitUntil:
          visible: { id: "composer-attach" }
          timeout: 8000
          optional: true
      - runFlow:
          file: switch-app.yaml
          env:
            APP_ID: ${APP_ID}
      - extendedWaitUntil:
          visible: { id: "composer-attach" }
          timeout: 15000
          optional: true
- assertVisible: { id: "composer-attach" }
