appId: io.twentysixty.mobileagent.dev
---
- openLink: ${LINK}
# Both flavors handle didcomm://, so with two apps installed Android asks which one to use
- runFlow:
    when:
      visible: "Open with"
    commands:
      - waitForAnimationToEnd
      # A tap on the row while the sheet still moves selects nothing and leaves "Just once" disabled
      - repeat:
          times: 3
          while:
            visible: "Open with"
          commands:
            - tapOn: ${APP_LABEL}
            - tapOn:
                text: "Just once"
                enabled: true
                optional: true
            - waitForAnimationToEnd
