appId: io.twentysixty.mobileagent.dev
---
- openLink: ${LINK}
# Both flavors handle didcomm://, so with two apps installed Android asks which one to use. After a first choice
# the sheet reads "Open with <last app>" with Just once enabled, and lists the other app under "Use a different app"
- runFlow:
    when:
      visible: "Open with.*"
    commands:
      - waitForAnimationToEnd
      # A tap on the row while the sheet still moves selects nothing and leaves "Just once" disabled
      - repeat:
          times: 3
          while:
            visible: "Open with.*"
          commands:
            - runFlow:
                when:
                  visible: "Open with ${APP_LABEL}"
                commands:
                  - tapOn:
                      text: "Just once"
                      enabled: true
            - runFlow:
                when:
                  visible: "Open with"
                commands:
                  - tapOn: ${APP_LABEL}
                  - tapOn:
                      text: "Just once"
                      enabled: true
                      optional: true
            - runFlow:
                when:
                  visible: "Open with (?!${APP_LABEL}$).+"
                commands:
                  - tapOn: ${APP_LABEL}
            - waitForAnimationToEnd
