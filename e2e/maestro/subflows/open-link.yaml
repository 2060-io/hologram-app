appId: io.twentysixty.mobileagent.dev
---
- openLink: ${LINK}
# Both flavors handle didcomm://, so Android asks for an app, as a list or, after a first choice, as "Open with <last app>"
- runFlow:
    when:
      visible: "Open with.*"
    commands:
      - waitForAnimationToEnd
      # A tap on the row while the sheet still moves selects nothing and leaves "Just once" disabled
      - repeat:
          times: 3
          while:
            visible: "Open with.*"
          commands:
            - runFlow:
                when:
                  visible: "Open with ${APP_LABEL}"
                commands:
                  - tapOn:
                      text: "Just once"
                      enabled: true
            - runFlow:
                when:
                  visible: "Open with"
                commands:
                  - tapOn: ${APP_LABEL}
                  - tapOn:
                      text: "Just once"
                      enabled: true
                      optional: true
            - runFlow:
                when:
                  visible: "Open with (?!${APP_LABEL}$).+"
                commands:
                  - tapOn: ${APP_LABEL}
            - waitForAnimationToEnd
