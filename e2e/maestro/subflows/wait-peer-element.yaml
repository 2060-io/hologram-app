appId: io.twentysixty.mobileagent.dev
---
# A background app closes its mediator socket, so each side needs foreground time to send and to receive
- repeat:
    times: 6
    while:
      notVisible: { id: "${TARGET_ID}" }
    commands:
      - runFlow:
          file: switch-app.yaml
          env:
            APP_ID: ${SENDER_APP_ID}
      - extendedWaitUntil:
          visible: { id: "${TARGET_ID}" }
          timeout: 5000
          optional: true
      - runFlow:
          file: switch-app.yaml
          env:
            APP_ID: ${RECEIVER_APP_ID}
      - extendedWaitUntil:
          visible: { id: "${TARGET_ID}" }
          timeout: 15000
          optional: true
- assertVisible: { id: "${TARGET_ID}" }
