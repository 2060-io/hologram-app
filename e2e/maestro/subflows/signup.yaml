appId: io.twentysixty.mobileagent.dev
---
- launchApp:
    appId: ${APP_ID}
    clearState: true
- extendedWaitUntil:
    visible: "Hologram Locked|Authenticate to open .*"
    timeout: 60000
- runFlow: unlock.yaml
- extendedWaitUntil:
    visible: "Choose your name"
    timeout: 60000
- tapOn: "Choose your name"
- inputText: ${NAME}
# ProfileCreation has no keyboardShouldPersistTaps, so a tap with the keyboard open only closes the keyboard
- hideKeyboard
- tapOn: "Get started"
- extendedWaitUntil:
    visible: "Add a connection to start chatting"
    timeout: 90000
- takeScreenshot: signup-done-${NAME}
