appId: io.twentysixty.mobileagent.dev
tags: [external, svc-chatbot]
---
- runFlow:
    file: ../subflows/signup.yaml
    env:
      APP_ID: io.twentysixty.mobileagent.dev
      NAME: Alice
- runScript: { file: ../scripts/chatbot-invitation.js }
- runFlow:
    file: ../subflows/open-link.yaml
    env:
      LINK: ${output.chatbot.link}
      APP_LABEL: Hologram dev
- extendedWaitUntil:
    visible: { id: "invitation-screen" }
    timeout: 90000
- extendedWaitUntil:
    visible: { id: "trust-card" }
    timeout: 90000
- extendedWaitUntil:
    visible: { id: "trust-status-trusted" }
    timeout: 90000
- assertNotVisible: { id: "invitation-age-restricted" }
- takeScreenshot: x01-a-invitation
- extendedWaitUntil:
    visible: { id: "invitation-accept" }
    timeout: 30000
- tapOn: { id: "invitation-accept" }
- extendedWaitUntil:
    visible: { id: "chat-screen" }
    timeout: 60000
- extendedWaitUntil:
    visible: "Welcome to our service.*"
    timeout: 90000
- extendedWaitUntil:
    visible: { id: "chat-menu" }
    timeout: 60000
- takeScreenshot: x01-b-welcome

- tapOn: { id: "chat-menu" }
- extendedWaitUntil:
    visible: ".*Home.*"
    timeout: 15000
- assertVisible: ".*World Cup poll.*"
- assertVisible: ".*Rocky quotes.*"
- takeScreenshot: x01-c-context-menu
- back
- extendedWaitUntil:
    visible: { id: "composer-input" }
    timeout: 15000

- tapOn: { id: "chat-header-name" }
- extendedWaitUntil:
    visible: { id: "connection-details-screen" }
    timeout: 20000
- extendedWaitUntil:
    visible: { id: "trust-card" }
    timeout: 60000
- assertVisible: { id: "trust-status-trusted" }
- takeScreenshot: x01-d-details
