appId: io.twentysixty.mobileagent.dev
tags: [external, svc-chatbot]
---
# Added first: the media picker lists a new file only once the media scanner has indexed it
- addMedia:
    - ../fixtures/image.jpg
    - ../fixtures/video.mp4
- runFlow:
    file: ../subflows/signup.yaml
    env:
      APP_ID: io.twentysixty.mobileagent.dev
      NAME: Alice
- runFlow: ../subflows/chatbot-connect.yaml
- extendedWaitUntil:
    visible: { id: "composer-attach" }
    timeout: 90000

- runFlow:
    file: ../subflows/chatbot-send.yaml
    env:
      TEXT: "/echo-media on"
- extendedWaitUntil:
    visible: "echo-media on"
    timeout: 60000

- runFlow:
    file: ../subflows/send-gallery-media.yaml
    env:
      LABEL: "Photo taken on .*"
- extendedWaitUntil:
    visible: { id: "chat-image" }
    timeout: 60000
- extendedWaitUntil:
    visible: "media-received image/.* [0-9]+ sha256:[0-9a-f]{64}"
    timeout: 180000
- runFlow:
    when:
      visible: "media-received image/.* [0-9]+ sha256:cc2df2416d0503244b1eabfed66c52c50598d9cdd43085fa13bf554695da25d8"
    commands:
      - takeScreenshot: x05-image-hash-matches-fixture
- runFlow:
    when:
      notVisible: "media-received image/.* [0-9]+ sha256:cc2df2416d0503244b1eabfed66c52c50598d9cdd43085fa13bf554695da25d8"
    commands:
      - takeScreenshot: x05-image-reencoded
- extendedWaitUntil:
    visible:
      id: "chat-image-(open|download)"
      below: "media-received image/.*"
    timeout: 120000
- runFlow:
    when:
      visible:
        id: "chat-image-download"
        below: "media-received image/.*"
    commands:
      - tapOn:
          id: "chat-image-download"
          below: "media-received image/.*"
- extendedWaitUntil:
    visible:
      id: "chat-image-open"
      below: "media-received image/.*"
    timeout: 120000
- tapOn:
    id: "chat-image-open"
    below: "media-received image/.*"
- extendedWaitUntil:
    visible: { id: "chat-image-lightbox" }
    timeout: 15000
- takeScreenshot: x05-a-image-echo
- back
- extendedWaitUntil:
    notVisible: { id: "chat-image-lightbox" }
    timeout: 15000

- runFlow:
    file: ../subflows/send-gallery-media.yaml
    env:
      LABEL: "Video.* on .*"
- extendedWaitUntil:
    visible: { id: "chat-video" }
    timeout: 120000
- extendedWaitUntil:
    visible: "media-received video/.* [0-9]+ sha256:[0-9a-f]{64}"
    timeout: 300000
- runFlow:
    when:
      visible: "media-received video/.* [0-9]+ sha256:ee8c562518a7bcb91ff89ccb1f3a74fc47031893c17f51b4ff4339e368d9d346"
    commands:
      - takeScreenshot: x05-video-hash-matches-fixture
- runFlow:
    when:
      notVisible: "media-received video/.* [0-9]+ sha256:ee8c562518a7bcb91ff89ccb1f3a74fc47031893c17f51b4ff4339e368d9d346"
    commands:
      - takeScreenshot: x05-video-reencoded
- extendedWaitUntil:
    visible:
      id: "chat-video-(download|play)"
      below: "media-received video/.*"
    timeout: 180000
- runFlow:
    when:
      visible:
        id: "chat-video-download"
        below: "media-received video/.*"
    commands:
      - tapOn:
          id: "chat-video-download"
          below: "media-received video/.*"
- extendedWaitUntil:
    visible:
      id: "chat-video-play"
      below: "media-received video/.*"
    timeout: 180000
- tapOn:
    id: "chat-video-play"
    below: "media-received video/.*"
- extendedWaitUntil:
    visible: { id: "chat-video-controls" }
    timeout: 30000
- assertNotVisible: "There was a problem loading the video."
- takeScreenshot: x05-b-video-echo
- back
- extendedWaitUntil:
    notVisible: { id: "chat-video-player" }
    timeout: 15000

- longPressOn: { id: "composer-mic" }
- extendedWaitUntil:
    visible: "While using the app"
    timeout: 10000
    optional: true
- runFlow:
    when:
      visible: "While using the app"
    commands:
      - tapOn: "While using the app"
# After the permission dialog the recording is locked and keeps running until the mic is tapped again
- extendedWaitUntil:
    visible: { id: "composer-recording-cancel|chat-voice-note" }
    timeout: 8000
    optional: true
- runFlow:
    when:
      visible: { id: "composer-recording-cancel" }
    commands:
      - extendedWaitUntil:
          visible: "never appears"
          timeout: 3000
          optional: true
      - tapOn: { id: "composer-mic" }
- extendedWaitUntil:
    visible: { id: "chat-voice-note" }
    timeout: 60000
- assertNotVisible: "Recorded audio is too short.*"
- extendedWaitUntil:
    visible: "media-received audio/.* [0-9]+ sha256:[0-9a-f]{64}"
    timeout: 180000
- extendedWaitUntil:
    visible:
      id: "chat-voice-note-(download|play)"
      below: "media-received audio/.*"
    timeout: 180000
- runFlow:
    when:
      visible:
        id: "chat-voice-note-download"
        below: "media-received audio/.*"
    commands:
      - tapOn:
          id: "chat-voice-note-download"
          below: "media-received audio/.*"
- extendedWaitUntil:
    visible:
      id: "chat-voice-note-play"
      below: "media-received audio/.*"
    timeout: 120000
- tapOn:
    id: "chat-voice-note-play"
    below: "media-received audio/.*"
- assertNotVisible: { id: "chat-voice-note-retry" }
- takeScreenshot: x05-c-voice-echo
