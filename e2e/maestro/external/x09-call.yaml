appId: io.twentysixty.mobileagent.dev
tags: [external, svc-chatbot]
---
- runFlow:
    file: ../subflows/signup.yaml
    env:
      APP_ID: io.twentysixty.mobileagent.dev
      NAME: Alice
- runFlow: ../subflows/chatbot-connect.yaml

- runFlow:
    file: ../subflows/chatbot-send.yaml
    env:
      TEXT: "/call"
- extendedWaitUntil:
    visible: "(?i)join call"
    timeout: 120000
- takeScreenshot: x09-a-call-offer
- tapOn: "(?i)join call"
- repeat:
    times: 3
    while:
      visible: "While using the app"
    commands:
      - tapOn: "While using the app"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: "End call|Connecting.*"
    timeout: 60000
    optional: true
- takeScreenshot: x09-b-in-call
- extendedWaitUntil:
    visible: "Call was succesful"
    timeout: 240000
- takeScreenshot: x09-c-success
