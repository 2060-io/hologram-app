appId: io.twentysixty.mobileagent.dev
tags: [external, svc-chatbot]
---
- runFlow:
    file: ../subflows/signup.yaml
    env:
      APP_ID: io.twentysixty.mobileagent.dev
      NAME: Alice
- runFlow: ../subflows/chatbot-connect.yaml

- runFlow:
    file: ../subflows/chatbot-send.yaml
    env:
      TEXT: "/proof"
- extendedWaitUntil:
    visible: { id: "chat-proof-request" }
    timeout: 90000
- extendedWaitUntil:
    visible: { id: "chat-proof-request-notify" }
    timeout: 30000
- assertNotVisible: { id: "chat-proof-request-accept" }
- takeScreenshot: x06-a-no-credential

- runFlow:
    file: ../subflows/chatbot-send.yaml
    env:
      TEXT: "/issue"
- extendedWaitUntil:
    visible: { id: "chat-credential-offer-accept" }
    timeout: 90000
- takeScreenshot: x06-b-offer
- tapOn: { id: "chat-credential-offer-accept" }
- extendedWaitUntil:
    visible: { id: "credential-offer-accept" }
    timeout: 60000
- takeScreenshot: x06-c-offer-screen
- tapOn: { id: "credential-offer-accept" }
- runFlow:
    when:
      visible: { id: "credential-offer-accept-anyway" }
    commands:
      - tapOn: { id: "credential-offer-accept-anyway" }
- extendedWaitUntil:
    visible: { id: "chat-screen" }
    timeout: 60000
- extendedWaitUntil:
    visible: { id: "chat-credential-offer-state-(done|credential-received)" }
    timeout: 120000
- takeScreenshot: x06-d-credential-added

- runFlow:
    file: ../subflows/chatbot-send.yaml
    env:
      TEXT: "/proof"
- extendedWaitUntil:
    visible: { id: "chat-proof-request-accept" }
    timeout: 90000
- takeScreenshot: x06-e-proof-request
- tapOn: { id: "chat-proof-request-accept" }
- extendedWaitUntil:
    visible: { id: "proof-request-screen" }
    timeout: 60000
- extendedWaitUntil:
    visible: { id: "proof-request-accept|proof-request-share-anyway" }
    timeout: 60000
- takeScreenshot: x06-f-proof-screen
- runFlow:
    when:
      visible: { id: "proof-request-share-anyway" }
    commands:
      - tapOn: { id: "proof-request-share-anyway" }
      - tapOn: { id: "proof-request-share-anyway-confirm" }
- runFlow:
    when:
      visible: { id: "proof-request-accept" }
    commands:
      - tapOn:
          id: "proof-request-accept"
          enabled: true
- extendedWaitUntil:
    visible: ".*Verified: true.*"
    timeout: 120000
- takeScreenshot: x06-g-verified
