appId: io.twentysixty.mobileagent.dev
tags: [external, svc-demo-issuer-accredited]
---
- runFlow: ../subflows/signup-both.yaml
- runFlow: ../subflows/connect-peers.yaml
- runFlow: ../subflows/get-demo-credential.yaml

- assertVisible: { id: "wallet-list" }
- tapOn:
    id: "wallet-credential-.*"
    index: 0
- extendedWaitUntil:
    visible: { id: "credential-details-screen" }
    timeout: 20000
- assertVisible: { id: "credential-card" }
- takeScreenshot: x16-details

- tapOn: { id: "credential-details-present" }
- tapOn: { id: "present-select-all" }
- tapOn: { id: "present-submit" }
- extendedWaitUntil:
    visible: "Bob *"
    timeout: 20000
- tapOn: "Bob *"
- tapOn: { id: "connections-selection-send" }
- extendedWaitUntil:
    visible: { id: "credential-details-screen" }
    timeout: 30000
- runFlow:
    file: ../subflows/wait-peer-element.yaml
    env:
      SENDER_APP_ID: io.twentysixty.mobileagent.dev
      RECEIVER_APP_ID: io.twentysixty.mobileagent.st
      TARGET_ID: chat-presentation-accept
- takeScreenshot: x16-b-presentation
- tapOn: { id: "chat-presentation-accept" }
- extendedWaitUntil:
    visible: "Accepted"
    timeout: 30000

- runFlow:
    file: ../subflows/switch-app.yaml
    env:
      APP_ID: io.twentysixty.mobileagent.dev
- tapOn: { id: "credential-details-present" }
- tapOn: { id: "present-select-all" }
- tapOn: { id: "present-submit" }
- extendedWaitUntil:
    visible: "Bob *"
    timeout: 20000
- tapOn: "Bob *"
- tapOn: { id: "connections-selection-send" }
- extendedWaitUntil:
    visible: { id: "credential-details-screen" }
    timeout: 30000
- runFlow:
    file: ../subflows/wait-peer-element.yaml
    env:
      SENDER_APP_ID: io.twentysixty.mobileagent.dev
      RECEIVER_APP_ID: io.twentysixty.mobileagent.st
      TARGET_ID: chat-presentation-refuse
- tapOn: { id: "chat-presentation-refuse" }
- tapOn: { id: "modal-confirm" }
- extendedWaitUntil:
    visible: "Refused"
    timeout: 30000

- runFlow:
    file: ../subflows/switch-app.yaml
    env:
      APP_ID: io.twentysixty.mobileagent.dev
- tapOn: { id: "credential-details-present" }
- tapOn: { id: "present-select-all" }
- tapOn: { id: "present-create-qr" }
- extendedWaitUntil:
    visible: { id: "present-qr-code" }
    timeout: 60000
- takeScreenshot: x16-a-qr
- tapOn: { id: "present-qr-share" }
- waitForAnimationToEnd
- tapOn: "Copy"
- waitForAnimationToEnd
- assertVisible: { id: "present-qr-code" }

- runFlow:
    file: ../subflows/switch-app.yaml
    env:
      APP_ID: io.twentysixty.mobileagent.st
- runFlow:
    when:
      visible: { id: "chat-back" }
    commands:
      - tapOn: { id: "chat-back" }
- tapOn: { id: "scan-tab" }
- tapOn: { id: "scan-link-tab" }
- longPressOn: { id: "scan-link-input" }
- tapOn: "Paste"
- tapOn: { id: "scan-link-open" }
- extendedWaitUntil:
    visible: { id: "invitation-accept" }
    timeout: 60000
- tapOn: { id: "invitation-accept" }
- extendedWaitUntil:
    notVisible: { id: "invitation-screen" }
    timeout: 60000
- extendedWaitUntil:
    visible: "Accept"
    timeout: 60000
- takeScreenshot: x16-b-link
- tapOn: "Accept"

- runFlow:
    file: ../subflows/wait-peer-element.yaml
    env:
      SENDER_APP_ID: io.twentysixty.mobileagent.st
      RECEIVER_APP_ID: io.twentysixty.mobileagent.dev
      TARGET_ID: credential-presented-approved
- takeScreenshot: x16-a-presented
- tapOn: { id: "present-qr-done" }
- extendedWaitUntil:
    visible: { id: "credential-details-screen" }
    timeout: 20000

- tapOn: { id: "credential-details-delete" }
- extendedWaitUntil:
    visible: { id: "modal-confirm" }
    timeout: 10000
- tapOn: { id: "modal-confirm" }
- extendedWaitUntil:
    visible: { id: "wallet-empty" }
    timeout: 30000
- takeScreenshot: x16-deleted
