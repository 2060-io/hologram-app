// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 26
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
        googlePlayServicesAuthVersion = "19.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath('com.android.tools.build:gradle')
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath 'com.google.gms:google-services:4.4.4'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin"
    }
}
apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"

def REACT_NATIVE_VERSION = new File(['node', '--print',"JSON.parse(require('fs').readFileSync(require.resolve('react-native/package.json'), 'utf-8')).version"].execute(null, rootDir).text.trim())

allprojects {
    configurations.configureEach {
        resolutionStrategy {
            force "com.facebook.react:hermes-android:" + REACT_NATIVE_VERSION
            force "com.facebook.react:react-android:" + REACT_NATIVE_VERSION
            // Keep slf4j on the 1.7.x line so logback-android:2.0.0 (used by
            // react-native-file-logger) can still locate its StaticLoggerBinder.
            // Otherwise mp4parser/isoparser (via react-native-compressor) drags in
            // 1.8.0-beta4, which switched to ServiceLoader bindings and is not
            // compatible with logback-android 2.x, causing NOPLoggerFactory at
            // runtime and the "cannot be cast to ch.qos.logback.classic.LoggerContext"
            // crash when configuring the file logger.
            force "org.slf4j:slf4j-api:1.7.36"
        }
    }
    repositories {
        mavenLocal()
        mavenCentral()
        google()
        maven { url 'https://www.jitpack.io' }
        maven { url 'https://maven.google.com' }
    }
}