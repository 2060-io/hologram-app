name: E2E smoke

on:
  push:
    branches: [main]
    paths-ignore:
      - 'doc/**'
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'doc/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    uses: ./.github/workflows/e2e-android.yml
    with:
      tags: smoke
