name: Continuous Deployment - Dev release

on:
  push:
    branches: [main, dev, 'release/**']

  workflow_dispatch:

env:
  MINIO_HOST: ${{ secrets.MINIO_HOST }}
  MINIO_USERNAME: ${{ secrets.MINIO_USERNAME }}
  MINIO_PASSWORD: ${{ secrets.MINIO_PASSWORD }}
jobs:
  semantic-release:
    runs-on: ubuntu-latest
    outputs:
      new-release-version: ${{ steps.release.outputs.release-version }}
      new-release-published: ${{ steps.release.outputs.new-release-published }}
      experimental: ${{ steps.release.outputs.experimental }}
    steps:
      - name: Checkout hologram-app
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup node v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org/'
          cache: yarn

      - name: Install dependencies
        run: |
          yarn install --immutable

      # Detect if this is an experimental build (manual workflow_dispatch)
      - name: Detect build mode
        id: mode
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
              echo "ERROR: Experimental builds cannot be triggered on 'main'. Select a feature or dev branch."
              exit 1
            fi
            echo "experimental=true" >> $GITHUB_OUTPUT
          else
            echo "experimental=false" >> $GITHUB_OUTPUT
          fi

      - uses: codfish/semantic-release-action@v3
        if: steps.mode.outputs.experimental == 'false'
        id: semantic
        with:
          branches: |
            [
              'release',
              { 
                name: 'main',
                prerelease: 'dev'
              }
            ]
          tag-format: "v${version}"
          additional-packages: |
            ['@2060.io/semantic-release-react-native@1.11.0']
          plugins: |
            [
              [
                "@semantic-release/commit-analyzer",
                {
                  "preset": "angular",
                  "releaseRules": [
                    {
                      "type": "*!",
                      "release": "major"
                    },
                    {
                      "type": "refactor",
                      "release": "patch"
                    }
                  ]
                }
              ],
              [
                "@semantic-release/npm",
                {
                  "npmPublish": false
                }
              ],
              [
                "semantic-release-react-native",
                {
                  "versionStrategy": {
                    "android": {
                      "buildNumber": "relative",
                      "preRelease": true
                    },
                    "ios": {
                      "buildNumber": "semantic",
                      "preRelease": true
                    }
                  }
                }
              ],
              "@semantic-release/release-notes-generator",
            ]

      # Consolidate outputs regardless of which path was taken
      - name: Consolidate release outputs
        id: release
        run: |
          if [[ "${{ steps.mode.outputs.experimental }}" == "true" ]]; then
            # Base version: last stable tag (no prerelease suffix), e.g. 0.9.4
            BASE_VERSION=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 | sed 's/^v//')
            VERSION="${BASE_VERSION}-exp.${{ github.run_number }}"
            # Create and push the tag so it's traceable in git
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
              echo "Tag v${VERSION} already exists, reusing."
            else
              git tag "v${VERSION}"
              git push origin "v${VERSION}"
            fi
            echo "release-version=${VERSION}" >> $GITHUB_OUTPUT
            echo "new-release-published=true" >> $GITHUB_OUTPUT
            echo "experimental=true" >> $GITHUB_OUTPUT
          else
            echo "release-version=${{ steps.semantic.outputs.release-version }}" >> $GITHUB_OUTPUT
            echo "new-release-published=${{ steps.semantic.outputs.new-release-published }}" >> $GITHUB_OUTPUT
            echo "experimental=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload Version files
        if: steps.release.outputs.new-release-published == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: version-files
          path: |
            ./ios/hologram/InfoPlist/Info-Dev.plist
            ./ios/hologram/InfoPlist/Info-Staging.plist
            ./ios/hologram/InfoPlist/Info-Prod.plist
            ./ios/hologram.xcodeproj/project.pbxproj
            ./android/app/build.gradle
            ./package.json

  build-android:
    if: ${{needs.semantic-release.outputs.new-release-published == 'true'}}
    runs-on: ubuntu-latest
    needs: [semantic-release]
    env:
      UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEY_KEYSTORE_PASSWORD }}
      UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
      UPLOAD_KEY_KEYSTORE_B64: ${{ secrets.UPLOAD_KEY_KEYSTORE_B64 }}
      NEW_RELEASE_VERSION: ${{needs.semantic-release.outputs.new-release-version}}
    steps:
      - name: Checkout hologram-app
        uses: actions/checkout@v4

      - name: Setup node v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org/'
          cache: yarn

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies
        run: |
          yarn install --immutable

      - uses: actions/download-artifact@v4
        with:
          name: version-files

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle.properties', 'yarn.lock') }}
          restore-keys: gradle-

      - name: Build Android
        working-directory: android
        run: |
          echo "$UPLOAD_KEY_KEYSTORE_B64" | base64 --decode > ./app/upload-key.keystore
          ./gradlew generateCodegenSchemaFromJavaScript generateCodegenArtifactsFromSchema
          ./gradlew assembleDevRelease -PreactNativeArchitectures=arm64-v8a

      - name: Setup MinIO client
        uses: yakubique/setup-minio-cli@v1

      - name: Upload app.apk to MinIO
        run: |
          echo "$PWD" >> $GITHUB_PATH
          mc alias set myminio https://$MINIO_HOST $MINIO_USERNAME $MINIO_PASSWORD
          mc mb --ignore-existing myminio/repository/dev/hologram-app/$NEW_RELEASE_VERSION
          mc cp ./android/app/build/outputs/apk/dev/release/app-dev-release.apk myminio/repository/dev/hologram-app/$NEW_RELEASE_VERSION/app.apk
          
          echo "app.apk uploaded to MinIO successfully."
  
  build-ios:
    if: ${{needs.semantic-release.outputs.new-release-published == 'true'}}
    runs-on: macos-latest
    needs: [semantic-release]
    env:
      NEW_RELEASE_VERSION: ${{needs.semantic-release.outputs.new-release-version}}
      KEYCHAIN_NAME: build.keychain
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      CERT_P12_PATH: cert.p12
    steps:
      - name: Checkout hologram-app
        uses: actions/checkout@v4

      - name: Setup node v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org/'
          cache: yarn

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies
        run: |
          yarn install --immutable

      - uses: actions/download-artifact@v4
        with:
          name: version-files

      - name: Install ccache
        run: brew install ccache

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ccache
          key: ccache-ios-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: ccache-ios-

      - name: Configure Keychain
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_NAME
          security set-keychain-settings -lut 21600 $KEYCHAIN_NAME
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_NAME
          security default-keychain -s $KEYCHAIN_NAME
          security list-keychains -d user -s $KEYCHAIN_NAME

      - name: Install Signing Certificate
        env:
          IOS_CERTIFICATE_P12: ${{ secrets.IOS_CERTIFICATE_P12 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          echo "$IOS_CERTIFICATE_P12" | base64 --decode > "$CERT_P12_PATH"

          security import "$CERT_P12_PATH" \
            -k $KEYCHAIN_NAME \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            $KEYCHAIN_NAME

          security find-identity -v -p codesigning $KEYCHAIN_NAME

      - name: Install Provisioning Profiles
        env:
          IOS_DEV_PROVISIONING_PROFILE: ${{ secrets.IOS_DEV_PROVISIONING_PROFILE }}
          IOS_SHARE_EXT_DEV_PROVISIONING_PROFILE: ${{ secrets.IOS_SHARE_EXT_DEV_PROVISIONING_PROFILE }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_DEV_PROVISIONING_PROFILE" | base64 --decode > io.2060.mobileagent.dev.mobileprovision
          echo "$IOS_SHARE_EXT_DEV_PROVISIONING_PROFILE" | base64 --decode > io.2060.mobileagent.dev.share.mobileprovision

          cp io.2060.mobileagent.dev.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
          cp io.2060.mobileagent.dev.share.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: pods-

      - name: Install Pods
        working-directory: ios
        run: |
          pod install

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: derived-data-${{ hashFiles('ios/Podfile.lock', 'yarn.lock') }}
          restore-keys: derived-data-

      - name: Build Archive
        working-directory: ios
        run: |
          xcodebuild archive \
            -workspace hologram.xcworkspace \
            -scheme 2060Dev \
            -sdk iphoneos \
            -archivePath builds/hologram.xcarchive \
            -destination "generic/platform=iOS"

      - name: Export IPA
        working-directory: ios
        run: |
          xcodebuild -exportArchive \
            -archivePath builds/hologram.xcarchive \
            -exportPath builds \
            -exportOptionsPlist hologram/ExportOptions.plist

      - name: Clean up Keychain, Certificate and Provisioning Profiles
        if: ${{ always() }}
        run: |
          security delete-keychain $KEYCHAIN_NAME
          rm "$CERT_P12_PATH"
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/io.2060.mobileagent.dev.mobileprovision
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/io.2060.mobileagent.dev.share.mobileprovision

      - name: Create manifest.plist
        run: |
          # Ensure the NEW_RELEASE_VERSION environment variable is set
          if [ -z "$NEW_RELEASE_VERSION" ]; then
            echo "ERROR: NEW_RELEASE_VERSION environment variable is not set."
            exit 1
          fi

          # Create manifest.plist with dynamic content
          cat > manifest.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
              <dict>
                  <key>items</key>
                  <array>
                      <dict>
                          <key>assets</key>
                          <array>
                              <dict>
                                  <key>kind</key>
                                  <string>software-package</string>
                                  <key>url</key>
                                  <string>https://$MINIO_HOST/repository/dev/hologram-app/$NEW_RELEASE_VERSION/app.ipa</string>
                              </dict>
                          </array>
                          <key>metadata</key>
                          <dict>
                              <key>bundle-identifier</key>
                              <string>io.2060.mobileagent.dev</string>
                              <key>bundle-version</key>
                              <string>$NEW_RELEASE_VERSION</string>
                              <key>kind</key>
                              <string>software</string>
                              <key>title</key>
                              <string>Hologram App</string>
                          </dict>
                      </dict>
                  </array>
              </dict>
          </plist>
          EOF

          echo "manifest.plist created successfully."

          # Create web page to access from browser
          cat > install.html <<EOF
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Install Hologram App</title>
          </head>
          <body>
              <button onclick="window.location.href='itms-services://?action=download-manifest&url=https%3A%2F%2F$MINIO_HOST%2Frepository%2Fdev%2Fhologram-app%2F$NEW_RELEASE_VERSION%2Fmanifest.plist'">
                  Tap to Install
              </button>
          </body>
          </html>
          EOF

          echo "install.html created successfully."

      - name: Setup MinIO client
        uses: yakubique/setup-minio-cli@v1

      - name: Upload manifest.plist to MinIO
        run: |
          echo "$PWD" >> $GITHUB_PATH
          mc alias set myminio https://$MINIO_HOST $MINIO_USERNAME $MINIO_PASSWORD
          # Upload the manifest.plist to the MinIO repository
          mc mb --ignore-existing myminio/repository/dev/hologram-app/$NEW_RELEASE_VERSION
          mc cp manifest.plist myminio/repository/dev/hologram-app/$NEW_RELEASE_VERSION/manifest.plist          
          echo "manifest.plist uploaded to MinIO successfully."

          mc cp install.html myminio/repository/dev/hologram-app/$NEW_RELEASE_VERSION/install.html          
          echo "install.html uploaded to MinIO successfully."

      - name: Upload app.ipa to MinIO
        run: |
          mc cp ./ios/builds/2060Dev.ipa myminio/repository/dev/hologram-app/$NEW_RELEASE_VERSION/app.ipa
          echo "app.ipa uploaded to MinIO successfully."

  notify-subscribers:
    if: ${{needs.semantic-release.outputs.new-release-published == 'true' && needs.semantic-release.outputs.experimental != 'true'}}
    runs-on: ubuntu-latest
    needs: [semantic-release, build-android, build-ios]
    env:
      NEW_RELEASE_VERSION: ${{needs.semantic-release.outputs.new-release-version}}
    steps:
      - name: Notify subscribers
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{secrets.DEPLOY_NOTIFICATION_USERNAME}}
          password: ${{secrets.DEPLOY_NOTIFICATION_PASSWORD}}
          subject: Version ${{ env.NEW_RELEASE_VERSION }} of Hologram is available
          to: ${{secrets.DEPLOY_NOTIFICATION_USERNAME}}
          bcc: ${{ vars.DEPLOY_NOTIFICATION_DEV_RECIPIENT_LIST }}
          from: 2060.io dev team
          # Optional HTML body read from file:
          html_body: |
            <html>
            <body>
            <p>Hello! We are glad to inform you that a new version of Hologram App is available.</p>

            <b>For Android</b>
            <a href=https://${{env.MINIO_HOST}}/repository/dev/hologram-app/${{env.NEW_RELEASE_VERSION}}/app.apk>Download the APK</a> and tap into the downloaded file to install the new version.

            <b>For iOS</b>
            <a href=https://${{env.MINIO_HOST}}/repository/dev/hologram-app/${{env.NEW_RELEASE_VERSION}}/install.html>Tap here to download and install</a> 
            <br />
            <p>Kind regards,</p>
            <p>2060.io Dev Team</p>
            </body>
            </html>
          ignore_cert: true
          convert_markdown: false

