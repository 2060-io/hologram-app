name: Continuous Integration - Build

on:
  push:
    branches: ['build/**', 'feat/bump**']

  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEY_KEYSTORE_PASSWORD }}
      UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
      UPLOAD_KEY_KEYSTORE_B64: ${{ secrets.UPLOAD_KEY_KEYSTORE_B64 }}
    steps:
      - name: Checkout hologram-app
        uses: actions/checkout@v4

      - name: Setup node v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org/'
          cache: yarn

      - name: Install dependencies
        run: |
          yarn install --immutable

      - name: Clean And Build Android
        run: |
          echo "$UPLOAD_KEY_KEYSTORE_B64" | base64 --decode > ./android/app/upload-key.keystore
          cd android
          rm -rf .gradle build app/build app/.cxx
          ./gradlew generateCodegenSchemaFromJavaScript generateCodegenArtifactsFromSchema
          ./gradlew assembleDevRelease

  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout hologram-app
        uses: actions/checkout@v4

      - name: Setup node v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org/'
          cache: yarn

      - name: Set up Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2.0'

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install dependencies
        run: |
          yarn install --immutable

      - name: Decode and install iOS certificate
        env:
          IOS_CERTIFICATE_P12: ${{ secrets.IOS_CERTIFICATE_P12 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          echo "$IOS_CERTIFICATE_P12" | base64 --decode > certificate.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import certificate.p12 -k build.keychain -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain

      - name: Decode and install provisioning profiles
        env:
          IOS_DEV_PROVISIONING_PROFILE: ${{ secrets.IOS_DEV_PROVISIONING_PROFILE }}
          IOS_SHARE_EXT_DEV_PROVISIONING_PROFILE: ${{ secrets.IOS_SHARE_EXT_DEV_PROVISIONING_PROFILE }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles

          echo "$IOS_DEV_PROVISIONING_PROFILE" | base64 --decode > app.mobileprovision
          echo "$IOS_SHARE_EXT_DEV_PROVISIONING_PROFILE" | base64 --decode > share.mobileprovision

          cp app.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
          cp share.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Build IOS
        run: |
          echo "New release published!"
          echo $RELEASE_VERSION
          set -o pipefail
          cd ios
          xcodebuild clean archive -workspace  hologram.xcworkspace -scheme 2060Dev -sdk iphoneos -archivePath builds/hologram.xcarchive -destination "generic/platform=iOS"
          xcodebuild -exportArchive -archivePath "builds/hologram.xcarchive" -exportPath "builds" -exportOptionsPlist hologram/ExportOptions.plist