name: Continuous Integration - Build

on:
  push:
    branches: ['build/**', 'feat/bump**']

  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEY_KEYSTORE_PASSWORD }}
      UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
      UPLOAD_KEY_KEYSTORE_B64: ${{ secrets.UPLOAD_KEY_KEYSTORE_B64 }}
    steps:
      - name: Checkout hologram-app
        uses: actions/checkout@v4

      - name: Setup node v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org/'
          cache: yarn

      - name: Install dependencies
        run: |
          yarn install --immutable

      - name: Clean And Build Android
        run: |
          echo "$UPLOAD_KEY_KEYSTORE_B64" | base64 --decode > ./android/app/upload-key.keystore
          cd android
          rm -rf .gradle build app/build app/.cxx
          ./gradlew generateCodegenSchemaFromJavaScript generateCodegenArtifactsFromSchema
          ./gradlew assembleDevRelease

  build-ios:
    runs-on: macos-latest

    env:
      KEYCHAIN_NAME: build.keychain
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2.0'

      - name: Install JS deps
        run: yarn install --immutable

      # -----------------------------
      # 🔐 Create and configure keychain
      # -----------------------------
      - name: Configure keychain
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_NAME
          security set-keychain-settings -lut 21600 $KEYCHAIN_NAME
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_NAME
          security default-keychain -s $KEYCHAIN_NAME
          security list-keychains -d user -s $KEYCHAIN_NAME

      # -----------------------------
      # 📜 Install signing certificate (.p12)
      # -----------------------------
      - name: Install certificate
        env:
          IOS_CERTIFICATE_P12: ${{ secrets.IOS_CERTIFICATE_P12 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          echo "$IOS_CERTIFICATE_P12" | base64 --decode > cert.p12

          security import cert.p12 \
            -k $KEYCHAIN_NAME \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            $KEYCHAIN_NAME

          security find-identity -v -p codesigning $KEYCHAIN_NAME

      # -----------------------------
      # 📦 Install provisioning profiles
      # -----------------------------
      - name: Install provisioning profiles
        env:
          IOS_DEV_PROVISIONING_PROFILE: ${{ secrets.IOS_DEV_PROVISIONING_PROFILE }}
          IOS_SHARE_EXT_DEV_PROVISIONING_PROFILE: ${{ secrets.IOS_SHARE_EXT_DEV_PROVISIONING_PROFILE }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles

          echo "$IOS_DEV_PROVISIONING_PROFILE" | base64 --decode > app.mobileprovision
          echo "$IOS_SHARE_EXT_DEV_PROVISIONING_PROFILE" | base64 --decode > share.mobileprovision

          cp app.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
          cp share.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

          ls ~/Library/MobileDevice/Provisioning\ Profiles/

      # -----------------------------
      # 🧱 Install Pods
      # -----------------------------
      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      # -----------------------------
      # 🏗 Archive
      # -----------------------------
      - name: Archive
        run: |
          cd ios
          xcodebuild clean archive \
            -workspace hologram.xcworkspace \
            -scheme 2060Dev \
            -sdk iphoneos \
            -archivePath builds/hologram.xcarchive \
            -destination "generic/platform=iOS"

      # -----------------------------
      # 📤 Export IPA
      # -----------------------------
      - name: Export IPA
        run: |
          cd ios
          xcodebuild -exportArchive \
            -archivePath builds/hologram.xcarchive \
            -exportPath builds \
            -exportOptionsPlist hologram/ExportOptions.plist