name: Continuous Integration - Build

on:
  push:
    branches: ['build/**', 'feat/bump**']

  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEY_KEYSTORE_PASSWORD }}
      UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
      UPLOAD_KEY_KEYSTORE_B64: ${{ secrets.UPLOAD_KEY_KEYSTORE_B64 }}
    steps:
      - name: Checkout hologram-app
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org/'
          cache: yarn

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('yarn.lock', 'patches/**') }}

      - name: Install Dependencies
        run: |
          yarn install --immutable

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle.properties', 'yarn.lock') }}
          restore-keys: gradle-

      - name: Build Android
        working-directory: android
        run: |
          echo "$UPLOAD_KEY_KEYSTORE_B64" | base64 --decode > ./app/upload-key.keystore
          ./gradlew generateCodegenSchemaFromJavaScript generateCodegenArtifactsFromSchema
          ./gradlew assembleDevRelease -PreactNativeArchitectures=arm64-v8a

  build-ios:
    runs-on: macos-latest

    env:
      KEYCHAIN_NAME: build.keychain
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      CERT_P12_PATH: cert.p12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org/'
          cache: yarn

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2.0'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('yarn.lock', 'patches/**') }}

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Install ccache
        run: brew install ccache

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ccache
          key: ccache-ios-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: ccache-ios-

      - name: Configure Keychain
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_NAME
          security set-keychain-settings -lut 21600 $KEYCHAIN_NAME
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_NAME
          security default-keychain -s $KEYCHAIN_NAME
          security list-keychains -d user -s $KEYCHAIN_NAME

      - name: Install Signing Certificate
        env:
          IOS_CERTIFICATE_P12: ${{ secrets.IOS_CERTIFICATE_P12 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          echo "$IOS_CERTIFICATE_P12" | base64 --decode > "$CERT_P12_PATH"

          security import "$CERT_P12_PATH" \
            -k $KEYCHAIN_NAME \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            $KEYCHAIN_NAME

          security find-identity -v -p codesigning $KEYCHAIN_NAME

      - name: Install Provisioning Profiles
        env:
          IOS_DEV_PROVISIONING_PROFILE: ${{ secrets.IOS_DEV_PROVISIONING_PROFILE }}
          IOS_SHARE_EXT_DEV_PROVISIONING_PROFILE: ${{ secrets.IOS_SHARE_EXT_DEV_PROVISIONING_PROFILE }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_DEV_PROVISIONING_PROFILE" | base64 --decode > io.2060.mobileagent.dev.mobileprovision
          echo "$IOS_SHARE_EXT_DEV_PROVISIONING_PROFILE" | base64 --decode > io.2060.mobileagent.dev.share.mobileprovision

          cp io.2060.mobileagent.dev.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
          cp io.2060.mobileagent.dev.share.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

          ls ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Debug Provisioning Profiles
        run: |
          grep -R "io.2060.mobileagent.dev" ~/Library/MobileDevice/Provisioning\ Profiles/ || true
          grep -R "io.2060.mobileagent.dev.share" ~/Library/MobileDevice/Provisioning\ Profiles/ || true

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ hashFiles('ios/Podfile.lock') }}

      - name: Install Pods
        working-directory: ios
        run: |
          pod update hermes-engine --no-repo-update
          pod install

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: derived-data-${{ hashFiles('ios/Podfile.lock', 'yarn.lock') }}

      - name: Build Archive
        working-directory: ios
        run: |
          xcodebuild archive \
            -workspace hologram.xcworkspace \
            -scheme Dev \
            -sdk iphoneos \
            -archivePath builds/hologram.xcarchive \
            -destination "generic/platform=iOS"

      - name: Export IPA
        working-directory: ios
        run: |
          xcodebuild -exportArchive \
            -archivePath builds/hologram.xcarchive \
            -exportPath builds \
            -exportOptionsPlist hologram/ExportOptions.plist

      - name: Clean up Keychain, Certificate and Provisioning Profiles
        if: ${{ always() }}
        run: |
          security delete-keychain $KEYCHAIN_NAME
          rm "$CERT_P12_PATH"
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/io.2060.mobileagent.dev.mobileprovision
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/io.2060.mobileagent.dev.share.mobileprovision
