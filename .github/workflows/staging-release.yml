name: Continuous Deployment - Staging release

on:
  push:
    branches: 
      - staging

  workflow_dispatch:

env:
  MINIO_HOST: ${{ secrets.MINIO_HOST }}
  MINIO_USERNAME: ${{ secrets.MINIO_USERNAME }}
  MINIO_PASSWORD: ${{ secrets.MINIO_PASSWORD }}
jobs:
  semantic-release:
    runs-on: ubuntu-latest
    outputs:
      new-release-version: ${{ steps.semantic.outputs.release-version }}
      new-release-published: ${{ steps.semantic.outputs.new-release-published }}
    steps:
      - name: Checkout hologram-app
        uses: actions/checkout@v4

      - name: Setup node v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org/'
          cache: yarn

      - name: Install dependencies
        run: |
          yarn install --immutable

      - uses: codfish/semantic-release-action@v3
        id: semantic
        with:
          branches: |
            [
              'release',
              { 
                name: 'staging',
                prerelease: 'staging'
              }
            ]
          tag-format: "v${version}"
          additional-packages: |
            ['@2060.io/semantic-release-react-native@1.11.0']
          plugins: |
            [
              [
                "@semantic-release/commit-analyzer",
                {
                  "preset": "angular",
                  "releaseRules": [
                    {
                      "type": "*!",
                      "release": "major"
                    },
                    {
                      "type": "refactor",
                      "release": "patch"
                    }
                  ]
                }
              ],
              [
                "@semantic-release/npm",
                {
                  "npmPublish": false
                }
              ],
              [
                "semantic-release-react-native",
                {
                  "versionStrategy": {
                    "android": {
                      "buildNumber": "relative",
                      "preRelease": true
                    },
                    "ios": {
                      "buildNumber": "semantic",
                      "preRelease": true
                    }
                  }
                }
              ],
              "@semantic-release/release-notes-generator",
            ]

      - name: Upload Version files
        if: steps.semantic.outputs.new-release-published == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: version-files
          path: |
            ./ios/hologram/InfoPlist/Info-Dev.plist
            ./ios/hologram/InfoPlist/Info-Staging.plist
            ./ios/hologram/InfoPlist/Info-Prod.plist
            ./ios/hologram.xcodeproj/project.pbxproj
            ./android/app/build.gradle
            ./package.json

  build-android:
    if: ${{needs.semantic-release.outputs.new-release-published == 'true'}}
    runs-on: self-hosted
    needs: [semantic-release]
    env:
      UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEY_KEYSTORE_PASSWORD }}
      UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
      UPLOAD_KEY_KEYSTORE_B64: ${{ secrets.UPLOAD_KEY_KEYSTORE_B64 }}
      NEW_RELEASE_VERSION: ${{needs.semantic-release.outputs.new-release-version}}
    steps:
      - name: Checkout hologram-app
        uses: actions/checkout@v4

      - name: Setup node v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org/'
          cache: yarn

      - name: Install dependencies
        run: |
          yarn install --immutable

      - uses: actions/download-artifact@v4
        with:
          name: version-files

      - name: Clean And Build Android
        run: |
          echo $UPLOAD_KEY_KEYSTORE_B64 | base64 --decode > ./android/app/upload-key.keystore
          npx react-native bundle --platform android --dev false --entry-file index.js --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/build/intermediates/res/merged/release/
          cd android
          rm -rf .gradle build app/build app/.cxx
          ./gradlew clean generateCodegenSchemaFromJavaScript generateCodegenArtifactsFromSchema assembleStagingRelease

      - name: Setup MinIO Client and Upload app.apk to MinIO
        run: |
          echo "$PWD" >> $GITHUB_PATH
          mc alias set myminio https://$MINIO_HOST $MINIO_USERNAME $MINIO_PASSWORD
          mc mb --ignore-existing myminio/repository/staging/hologram-app/$NEW_RELEASE_VERSION
          mc cp ./android/app/build/outputs/apk/staging/release/app-staging-release.apk myminio/repository/staging/hologram-app/$NEW_RELEASE_VERSION/app.apk

          echo "app.apk uploaded to MinIO successfully."

  build-ios:
    if: ${{needs.semantic-release.outputs.new-release-published == 'true'}}
    runs-on: self-hosted
    needs: [semantic-release]
    env:
      NEW_RELEASE_VERSION: ${{needs.semantic-release.outputs.new-release-version}}
    steps:
      - name: Checkout hologram-app
        uses: actions/checkout@v4

      - name: Setup node v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org/'
          cache: yarn

      - name: Install dependencies
        run: |
          yarn install --immutable

      - uses: actions/download-artifact@v4
        with:
          name: version-files

      - name: Build IOS
        run: |
          echo "New release published!"
          echo $RELEASE_VERSION
          cd ios
          pod install --repo-update
          xcodebuild clean archive -workspace  hologram.xcworkspace -scheme Staging -allowProvisioningUpdates -sdk iphoneos -archivePath builds/hologram.xcarchive -destination "generic/platform=iOS" | xcpretty
          xcodebuild -exportArchive -archivePath "builds/hologram.xcarchive" -exportPath "builds" -exportOptionsPlist hologram/ExportOptions.plist | xcpretty

      - name: Create manifest.plist
        run: |
          # Ensure the NEW_RELEASE_VERSION environment variable is set
          if [ -z "$NEW_RELEASE_VERSION" ]; then
            echo "ERROR: NEW_RELEASE_VERSION environment variable is not set."
            exit 1
          fi

          # Create manifest.plist with dynamic content
          cat > manifest.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
              <dict>
                  <key>items</key>
                  <array>
                      <dict>
                          <key>assets</key>
                          <array>
                              <dict>
                                  <key>kind</key>
                                  <string>software-package</string>
                                  <key>url</key>
                                  <string>https://$MINIO_HOST/repository/staging/hologram-app/$NEW_RELEASE_VERSION/app.ipa</string>
                              </dict>
                          </array>
                          <key>metadata</key>
                          <dict>
                              <key>bundle-identifier</key>
                              <string>io.2060.mobileagent.st</string>
                              <key>bundle-version</key>
                              <string>$NEW_RELEASE_VERSION</string>
                              <key>kind</key>
                              <string>software</string>
                              <key>title</key>
                              <string>Hologram App</string>
                          </dict>
                      </dict>
                  </array>
              </dict>
          </plist>
          EOF

          echo "manifest.plist created successfully."

          # Create web page to access from browser
          cat > install.html <<EOF
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Install Hologram App</title>
          </head>
          <body>
              <button onclick="window.location.href='itms-services://?action=download-manifest&url=https%3A%2F%2F$MINIO_HOST%2Frepository%2Fstaging%2Fhologram-app%2F$NEW_RELEASE_VERSION%2Fmanifest.plist'">
                  Tap to Install
              </button>
          </body>
          </html>
          EOF

          echo "install.html created successfully."

      - name: Setup MinIO Client
        run: |
          echo "$PWD" >> $GITHUB_PATH
          mc alias set myminio https://$MINIO_HOST $MINIO_USERNAME $MINIO_PASSWORD

      - name: Upload manifest.plist to MinIO
        run: |
          # Upload the manifest.plist to the MinIO repository
          mc mb --ignore-existing myminio/repository/staging/hologram-app/$NEW_RELEASE_VERSION
          mc cp manifest.plist myminio/repository/staging/hologram-app/$NEW_RELEASE_VERSION/manifest.plist          
          echo "manifest.plist uploaded to MinIO successfully."

          mc cp install.html myminio/repository/staging/hologram-app/$NEW_RELEASE_VERSION/install.html          
          echo "install.html uploaded to MinIO successfully."

      - name: Upload app.ipa to MinIO
        run: |
          mc cp ./ios/builds/Staging.ipa myminio/repository/staging/hologram-app/$NEW_RELEASE_VERSION/app.ipa
          echo "app.ipa uploaded to MinIO successfully."

  notify-subscribers:
    if: ${{needs.semantic-release.outputs.new-release-published == 'true'}}
    runs-on: self-hosted
    needs: [semantic-release, build-android, build-ios]
    env:
      NEW_RELEASE_VERSION: ${{needs.semantic-release.outputs.new-release-version}}
    steps:
      - name: Notify subscribers
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{secrets.DEPLOY_NOTIFICATION_USERNAME}}
          password: ${{secrets.DEPLOY_NOTIFICATION_PASSWORD}}
          subject: Version ${{ env.NEW_RELEASE_VERSION }} of Hologram is available
          to: ${{secrets.DEPLOY_NOTIFICATION_USERNAME}}
          bcc: ${{ vars.DEPLOY_NOTIFICATION_STAGING_RECIPIENT_LIST }}
          from: 2060.io dev team
          # Optional HTML body read from file:
          html_body: |
            <html>
            <body>
            <p>Hello! We are glad to inform you that a new version of Hologram App is available.</p>
  
            <b>For Android</b>
            <a href=https://${{env.MINIO_HOST}}/repository/staging/hologram-app/${{env.NEW_RELEASE_VERSION}}/app.apk>Download the APK</a> and tap into the downloaded file to install the new version.
  
            <b>For iOS</b>
            <a href=https://${{env.MINIO_HOST}}/repository/staging/hologram-app/${{env.NEW_RELEASE_VERSION}}/install.html>Tap here to download and install</a> 
            <br />
            <p>Kind regards,</p>
            <p>2060.io Dev Team</p>
            </body>
            </html>
          ignore_cert: true
          convert_markdown: false
  