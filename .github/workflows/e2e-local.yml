name: E2E local

on:
  push:
    branches: [main]
    paths-ignore:
      - 'doc/**'
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'doc/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-local-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  local:
    uses: ./.github/workflows/e2e-android.yml
    with:
      tags: smoke,local
      start-stack: true
