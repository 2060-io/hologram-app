name: E2E local

on:
  pull_request:
    paths:
      - 'android/**'
      - 'e2e/**'
      - '.env.e2e-*'
      - '.github/workflows/e2e-*.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-local-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local:
    uses: ./.github/workflows/e2e-android.yml
    with:
      tags: smoke,local
      start-stack: true
