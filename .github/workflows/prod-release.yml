name: Continuous Deployment - Prod release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"        
  workflow_dispatch:
    inputs:
      version-number:
        type: string
        description: Semantic Version to be published (e.g. 2.5.0')
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hologram-app
        uses: actions/checkout@v4

      - name: Setup node v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org/'
          cache: yarn

      - name: Install dependencies
        run: |
          yarn install --immutable

      - name: Update version
        run: |
          if [ -n "${{ github.event.inputs.version-number }}" ]; then
            VERSION_NUMBER="${{ github.event.inputs.version-number }}"
          elif [ -n "${{ github.ref }}" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION_NUMBER="${TAG#v}"
          fi        
          yarn version --new-version $VERSION_NUMBER --no-git-tag-version
          yarn postversion

      - name: Upload Version files
        uses: actions/upload-artifact@v4
        with:
          name: version-files
          path: |
            ./ios/hologram/InfoPlist/Info-Dev.plist
            ./ios/hologram/InfoPlist/Info-Staging.plist
            ./ios/hologram/InfoPlist/Info-Prod.plist
            ./ios/hologram.xcodeproj/project.pbxproj
            ./android/app/build.gradle
            ./package.json

  build-android:
    runs-on: ubuntu-latest
    needs: [release]
    env:
      UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEY_KEYSTORE_PASSWORD }}
      UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
      UPLOAD_KEY_KEYSTORE_B64: ${{ secrets.UPLOAD_KEY_KEYSTORE_B64 }}
    steps:
      - name: Checkout hologram-app
        uses: actions/checkout@v4

      - name: Setup node v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org/'
          cache: yarn

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('yarn.lock', 'patches/**') }}

      - name: Install dependencies
        run: |
          yarn install --immutable

      - uses: actions/download-artifact@v4
        with:
          name: version-files

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle.properties', 'yarn.lock') }}
          restore-keys: gradle-

      - name: Build Android
        working-directory: android
        run: |
          echo "$UPLOAD_KEY_KEYSTORE_B64" | base64 --decode > ./app/upload-key.keystore
          ./gradlew generateCodegenSchemaFromJavaScript generateCodegenArtifactsFromSchema
          ./gradlew assembleProdRelease
          ./gradlew bundleProdRelease

      - name: Upload Android App Bundle to Google Play Store
        id: upload_aab
        uses: KevinRohn/github-action-upload-play-store@v1.0.1
        with:
          service_account_json: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
          package_name: "io.twentysixty.mobileagent.m"
          aab_file_path: "./android/app/build/outputs/bundle/prodRelease/app-prod-release.aab"
          track: "internal"
          release_status: "draft"

  build-ios:
    runs-on: macos-latest
    needs: [release]
    env:
      KEYCHAIN_NAME: build.keychain
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      CERT_P12_PATH: cert.p12
    steps:
      - name: Checkout hologram-app
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - name: Setup node v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org/'
          cache: yarn

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('yarn.lock', 'patches/**') }}

      - name: Install dependencies
        run: |
          yarn install --immutable

      - uses: actions/download-artifact@v4
        with:
          name: version-files

      - name: Install ccache
        run: brew install ccache

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ccache
          key: ccache-ios-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: ccache-ios-

      - name: Configure Keychain
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_NAME
          security set-keychain-settings -lut 21600 $KEYCHAIN_NAME
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_NAME
          security default-keychain -s $KEYCHAIN_NAME
          security list-keychains -d user -s $KEYCHAIN_NAME

      - name: Install Signing Certificate
        env:
          IOS_DISTRIBUTION_CERTIFICATE_P12: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          echo "$IOS_DISTRIBUTION_CERTIFICATE_P12" | base64 --decode > "$CERT_P12_PATH"

          security import "$CERT_P12_PATH" \
            -k $KEYCHAIN_NAME \
            -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            $KEYCHAIN_NAME

          security find-identity -v -p codesigning $KEYCHAIN_NAME

      - name: Install Provisioning Profiles
        env:
          IOS_PROD_PROVISIONING_PROFILE: ${{ secrets.IOS_PROD_PROVISIONING_PROFILE }}
          IOS_SHARE_EXT_PROD_PROVISIONING_PROFILE: ${{ secrets.IOS_SHARE_EXT_PROD_PROVISIONING_PROFILE }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_PROD_PROVISIONING_PROFILE" | base64 --decode > io.2060.mobileagent.m.mobileprovision
          echo "$IOS_SHARE_EXT_PROD_PROVISIONING_PROFILE" | base64 --decode > io.2060.mobileagent.m.share.mobileprovision

          cp io.2060.mobileagent.m.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
          cp io.2060.mobileagent.m.share.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ hashFiles('ios/Podfile.lock') }}

      - name: Install Pods
        working-directory: ios
        run: |
          pod install --repo-update || {
            echo "pod install failed due to Podfile.lock drift; regenerating lockfile"
            rm -f Podfile.lock
            pod install --repo-update
          }

      - name: Build Archive
        working-directory: ios
        run: |
          xcodebuild archive \
            -workspace hologram.xcworkspace \
            -scheme Prod \
            -sdk iphoneos \
            -archivePath builds/hologram.xcarchive \
            -destination "generic/platform=iOS"

      - name: Verify JS Bundle
        working-directory: ios
        run: |
          BUNDLE_PATH="builds/hologram.xcarchive/Products/Applications/Prod.app/main.jsbundle"
          if [ ! -f "$BUNDLE_PATH" ]; then
            echo "error: main.jsbundle is missing from the archive!" >&2
            exit 1
          fi
          SIZE=$(stat -f%z "$BUNDLE_PATH")
          echo "main.jsbundle size: $SIZE bytes"
          if [ "$SIZE" -lt 1000 ]; then
            echo "error: main.jsbundle is suspiciously small ($SIZE bytes)!" >&2
            exit 1
          fi

      - name: Export IPA
        working-directory: ios
        run: |
          xcodebuild -exportArchive \
            -archivePath builds/hologram.xcarchive \
            -exportPath builds \
            -exportOptionsPlist hologram/ExportOptionsProd.plist

      - name: Clean up Keychain, Certificate and Provisioning Profiles
        if: ${{ always() }}
        run: |
          security delete-keychain $KEYCHAIN_NAME
          rm "$CERT_P12_PATH"
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/io.2060.mobileagent.m.mobileprovision
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/io.2060.mobileagent.m.share.mobileprovision

      - name: Upload to AppStoreConnect
        run: |
          xcrun altool --upload-app -f ./ios/builds/Prod.ipa -t ios -u ${{ secrets.APPSTORECONNECT_USERNAME }} -p ${{ secrets.APPSTORECONNECT_PASSWORD }}

