name: Continuous Deployment - Prod release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"        
  workflow_dispatch:
    inputs:
      version-number:
        type: string
        description: Semantic Version to be published (e.g. 2.5.0')
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hologram-app
        uses: actions/checkout@v4

      - name: Setup node v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org/'
          cache: yarn

      - name: Install dependencies
        run: |
          yarn install --immutable

      - name: Update version
        run: |
          if [ -n "${{ github.event.inputs.version-number }}" ]; then
            VERSION_NUMBER="${{ github.event.inputs.version-number }}"
          elif [ -n "${{ github.ref }}" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION_NUMBER="${TAG#v}"
          fi        
          yarn version --new-version $VERSION_NUMBER --no-git-tag-version
          yarn postversion

      - name: Upload Version files
        uses: actions/upload-artifact@v4
        with:
          name: version-files
          path: |
            ./ios/hologram/InfoPlist/Info-Dev.plist
            ./ios/hologram/InfoPlist/Info-Staging.plist
            ./ios/hologram/InfoPlist/Info-Prod.plist
            ./ios/hologram.xcodeproj/project.pbxproj
            ./android/app/build.gradle
            ./package.json

  build-android:
    runs-on: self-hosted
    needs: [release]
    env:
      UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEY_KEYSTORE_PASSWORD }}
      UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
      UPLOAD_KEY_KEYSTORE_B64: ${{ secrets.UPLOAD_KEY_KEYSTORE_B64 }}
    steps:
      - name: Checkout hologram-app
        uses: actions/checkout@v4

      - name: Setup node v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org/'
          cache: yarn

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies
        run: |
          yarn install --immutable

      - uses: actions/download-artifact@v4
        with:
          name: version-files

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle.properties', 'yarn.lock') }}
          restore-keys: gradle-

      - name: Build Android
        working-directory: android
        run: |
          echo "$UPLOAD_KEY_KEYSTORE_B64" | base64 --decode > ./app/upload-key.keystore
          ./gradlew generateCodegenSchemaFromJavaScript generateCodegenArtifactsFromSchema
          ./gradlew assembleProdRelease
          ./gradlew bundleProdRelease

      - name: Upload Android App Bundle to Google Play Store
        id: upload_aab
        uses: KevinRohn/github-action-upload-play-store@v1.0.1
        with:
          service_account_json: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
          package_name: "io.twentysixty.mobileagent.m"
          aab_file_path: "./android/app/build/outputs/bundle/prodRelease/app-prod-release.aab"
          track: "internal"
          release_status: "draft"

  build-ios:
    runs-on: self-hosted
    needs: [release]
    steps:
      - name: Checkout hologram-app
        uses: actions/checkout@v4

      - name: Setup node v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org/'
          cache: yarn

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies
        run: |
          yarn install --immutable

      - uses: actions/download-artifact@v4
        with:
          name: version-files

      - name: Install ccache
        run: brew install ccache

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ccache
          key: ccache-ios-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: ccache-ios-

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: pods-

      - name: Install Pods
        working-directory: ios
        run: |
          pod install

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: derived-data-${{ hashFiles('ios/Podfile.lock', 'yarn.lock') }}
          restore-keys: derived-data-

      - name: Build IOS
        working-directory: ios
        run: |
          xcodebuild archive -workspace hologram.xcworkspace -scheme Prod -allowProvisioningUpdates -sdk iphoneos -archivePath builds/hologram.xcarchive -destination "generic/platform=iOS" | xcpretty
          xcodebuild -exportArchive -archivePath "builds/hologram.xcarchive" -exportPath "builds" -exportOptionsPlist hologram/ExportOptionsProd.plist | xcpretty

      - name: Upload to AppStoreConnect
        run: |
          xcrun altool --upload-app -f ./ios/builds/Prod.ipa -t ios -u ${{ secrets.APPSTORECONNECT_USERNAME }} -p ${{ secrets.APPSTORECONNECT_PASSWORD }}

