name: Continuous Deployment - Prod release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"        
  workflow_dispatch:
    inputs:
      version-number:
        type: string
        description: Semantic Version to be published (e.g. 2.5.0')
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hologram-app
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup node v22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org/'
          cache: pnpm

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Update version
        run: |
          if [ -n "${{ github.event.inputs.version-number }}" ]; then
            VERSION_NUMBER="${{ github.event.inputs.version-number }}"
          elif [ -n "${{ github.ref }}" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION_NUMBER="${TAG#v}"
          fi        
          pnpm version --new-version $VERSION_NUMBER --no-git-tag-version
          pnpm postversion

      - name: Upload Version files
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: version-files
          path: |
            ./ios/hologram/InfoPlist/Info-Dev.plist
            ./ios/hologram/InfoPlist/Info-Staging.plist
            ./ios/hologram/InfoPlist/Info-Prod.plist
            ./ios/hologram.xcodeproj/project.pbxproj
            ./android/app/build.gradle
            ./package.json

  build-android:
    runs-on: ubuntu-latest
    needs: [release]
    env:
      UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEY_KEYSTORE_PASSWORD }}
      UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
      UPLOAD_KEY_KEYSTORE_B64: ${{ secrets.UPLOAD_KEY_KEYSTORE_B64 }}
    steps:
      - name: Checkout hologram-app
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup node v22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org/'
          cache: pnpm

      - name: Cache node_modules
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml', 'patches/**') }}

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: version-files

      - name: Cache Gradle
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle.properties', 'pnpm-lock.yaml') }}
          restore-keys: gradle-

      - name: Build Android
        working-directory: android
        run: |
          echo "$UPLOAD_KEY_KEYSTORE_B64" | base64 --decode > ./app/upload-key.keystore
          ./gradlew generateCodegenSchemaFromJavaScript generateCodegenArtifactsFromSchema
          ./gradlew assembleProdRelease
          ./gradlew bundleProdRelease

      - name: Decode Google Play service account
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
        run: |
          echo "$GOOGLE_SERVICE_ACCOUNT_JSON_B64" | base64 --decode > play-service-account.json

      - name: Upload Android App Bundle to Google Play Store
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJson: play-service-account.json
          packageName: "io.twentysixty.mobileagent.m"
          releaseFiles: "./android/app/build/outputs/bundle/prodRelease/app-prod-release.aab"
          tracks: "internal"
          status: "draft"

      - name: Clean up Google Play service account
        if: ${{ always() }}
        run: rm -f play-service-account.json

  build-ios:
    runs-on: macos-latest
    needs: [release]
    env:
      KEYCHAIN_NAME: build.keychain
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      CERT_P12_PATH: cert.p12
    steps:
      - name: Checkout hologram-app
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.3.0'

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup node v22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org/'
          cache: pnpm

      - name: Cache node_modules
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml', 'patches/**') }}

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: version-files

      - name: Install ccache
        run: brew install ccache

      - name: Cache ccache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/Library/Caches/ccache
          key: ccache-ios-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: ccache-ios-

      - name: Configure Keychain
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_NAME
          security set-keychain-settings -lut 21600 $KEYCHAIN_NAME
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_NAME
          security default-keychain -s $KEYCHAIN_NAME
          security list-keychains -d user -s $KEYCHAIN_NAME

      - name: Install Signing Certificate
        env:
          IOS_DISTRIBUTION_CERTIFICATE_P12: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          echo "$IOS_DISTRIBUTION_CERTIFICATE_P12" | base64 --decode > "$CERT_P12_PATH"

          security import "$CERT_P12_PATH" \
            -k $KEYCHAIN_NAME \
            -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            $KEYCHAIN_NAME

          security find-identity -v -p codesigning $KEYCHAIN_NAME

      - name: Install Provisioning Profiles
        env:
          IOS_PROD_PROVISIONING_PROFILE: ${{ secrets.IOS_PROD_PROVISIONING_PROFILE }}
          IOS_SHARE_EXT_PROD_PROVISIONING_PROFILE: ${{ secrets.IOS_SHARE_EXT_PROD_PROVISIONING_PROFILE }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_PROD_PROVISIONING_PROFILE" | base64 --decode > io.2060.mobileagent.m.mobileprovision
          echo "$IOS_SHARE_EXT_PROD_PROVISIONING_PROFILE" | base64 --decode > io.2060.mobileagent.m.share.mobileprovision

          cp io.2060.mobileagent.m.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
          cp io.2060.mobileagent.m.share.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Cache CocoaPods
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ hashFiles('ios/Podfile.lock') }}

      - name: Install Pods
        working-directory: ios
        run: |
          pod update hermes-engine --no-repo-update
          pod install

      - name: Cache DerivedData
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: derived-data-${{ hashFiles('ios/Podfile.lock', 'pnpm-lock.yaml') }}

      - name: Build Archive
        working-directory: ios
        run: |
          xcodebuild archive \
            -workspace hologram.xcworkspace \
            -scheme Prod \
            -sdk iphoneos \
            -archivePath builds/hologram.xcarchive \
            -destination "generic/platform=iOS"

      - name: Export IPA
        working-directory: ios
        run: |
          xcodebuild -exportArchive \
            -archivePath builds/hologram.xcarchive \
            -exportPath builds \
            -exportOptionsPlist hologram/ExportOptionsProd.plist

      - name: Clean up Keychain, Certificate and Provisioning Profiles
        if: ${{ always() }}
        run: |
          security delete-keychain $KEYCHAIN_NAME
          rm "$CERT_P12_PATH"
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/io.2060.mobileagent.m.mobileprovision
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/io.2060.mobileagent.m.share.mobileprovision

      - name: Upload to AppStoreConnect
        run: |
          xcrun altool --upload-app -f ./ios/builds/Prod.ipa -t ios -u ${{ secrets.APPSTORECONNECT_USERNAME }} -p ${{ secrets.APPSTORECONNECT_PASSWORD }}

